name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  workers:
    name: Workers (typecheck + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if workers/ is initialized
        id: check
        run: |
          if [ -f workers/package.json ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
            echo "::notice::workers/ not yet initialized — skipping CI for this job."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.initialized == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: workers/package-lock.json
      - name: npm ci
        if: steps.check.outputs.initialized == 'true'
        working-directory: workers
        run: npm ci
      - name: typecheck
        if: steps.check.outputs.initialized == 'true'
        working-directory: workers
        run: npm run typecheck
      - name: lint
        if: steps.check.outputs.initialized == 'true'
        working-directory: workers
        run: npm run lint
      - name: test
        if: steps.check.outputs.initialized == 'true'
        working-directory: workers
        run: npm test

  extension:
    name: Extension (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if extension/ is initialized
        id: check
        run: |
          if [ -f extension/package.json ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
            echo "::notice::extension/ not yet initialized — skipping CI for this job."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.initialized == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json
      - name: npm ci
        if: steps.check.outputs.initialized == 'true'
        working-directory: extension
        run: npm ci
      - name: typecheck
        if: steps.check.outputs.initialized == 'true'
        working-directory: extension
        run: npm run typecheck
      - name: lint
        if: steps.check.outputs.initialized == 'true'
        working-directory: extension
        run: npm run lint
      - name: test
        if: steps.check.outputs.initialized == 'true'
        working-directory: extension
        run: npm test
      - name: build
        if: steps.check.outputs.initialized == 'true'
        working-directory: extension
        run: npm run build
