<!doctype html>
<!--
  Structure captured from the live watchfinder.co.uk product page on 2026-06-03: NO JSON-LD;
  the main watch's brand/model/ref are in the <h1>, the price is a compact currency span
  OUTSIDE the related-watch `.product-card`s. The related card below (different ref + price)
  must NOT be picked up as the main listing.
-->
<html lang="en">
  <head><title>Rolex Submariner 116610LN - Watchfinder</title></head>
  <body>
    <section class="product-hero">
      <h1>Rolex Submariner 116610LN</h1>
      <span class="h2 bold reduced-padding">£11,800</span>
    </section>
    <section class="related-watches">
      <div class="product-card large">
        <div class="card-brand">Rolex</div>
        <div class="card-series">Submariner</div>
        <div class="card-model-number">126610LN</div>
        <span class="card-price weight-strong">£14,500</span>
      </div>
    </section>
  </body>
</html>
