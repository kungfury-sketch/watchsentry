<!--
  Structurally verified against the live Chrono24 listing-detail JSON-LD format
  (captured via Claude in Chrome MCP probe on 2026-05-20 against
  /rolex/rolex-submariner--id45858844.htm). Live pages wrap the Product entry
  inside a top-level @graph array (see chrono24-listing.test.ts "finds Product
  nested inside @graph" case). This fixture exercises the top-level @type=Product
  variant; the @graph variant is tested inline in the test file.

  Why not a verbatim real-page capture: Claude in Chrome MCP's content filter
  blocks page-HTML exfiltration (security feature), and direct curl is gated by
  Cloudflare's bot challenge. The synthetic schema below mirrors the relevant
  fields the parser reads: brand.name, sku, offers.priceCurrency, offers.price,
  productID, optional offers.itemCondition. Update if Chrono24 changes the
  schema shape (run the live JS probe documented in the parser commit message).
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rolex Submariner Date 124060 — Chrono24 (SYNTHETIC FIXTURE)</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Rolex Submariner Date 124060",
    "brand": { "@type": "Brand", "name": "Rolex" },
    "sku": "124060",
    "mpn": "124060",
    "model": "Submariner Date",
    "productID": "synthetic-listing-id-001",
    "image": [
      "https://example.invalid/img/124060-1.jpg",
      "https://example.invalid/img/124060-2.jpg"
    ],
    "description": "Rolex Submariner Date 124060, 41mm stainless steel, black dial, oyster bracelet, 2023.",
    "offers": {
      "@type": "Offer",
      "priceCurrency": "USD",
      "price": "9500.00",
      "itemCondition": "https://schema.org/UsedCondition",
      "availability": "https://schema.org/InStock",
      "seller": { "@type": "Organization", "name": "Synthetic Dealer Co." }
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Watches" },
      { "@type": "ListItem", "position": 2, "name": "Rolex" },
      { "@type": "ListItem", "position": 3, "name": "Submariner Date" }
    ]
  }
  </script>
</head>
<body>
  <h1>Rolex Submariner Date 124060</h1>
  <div class="js-detail-page-price-section">
    <span class="price">$9,500</span>
  </div>
</body>
</html>
